# ollama-proxy: the target agent's only path to the Ollama server on the host (Live AI mode).
# Reachable only from the target (internal network ollama_net); the only service with a route
# to host.docker.internal. Holds no credential. Forwards exactly two read/answer endpoints and
# refuses everything else, so a compromised target cannot pull, delete, create or copy models.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 11434;
        client_max_body_size 64k; # one prompt plus the system prompt; the target caps prompts at 8000 chars

        # Answer one prompt.
        location = /api/chat {
            limit_except POST { deny all; }
            proxy_pass http://host.docker.internal:11434;
            proxy_set_header Host localhost; # Ollama accepts local Host names only
            proxy_read_timeout 300s;
        }

        # Readiness: which models are installed (read-only).
        location = /api/tags {
            limit_except GET { deny all; }
            proxy_pass http://host.docker.internal:11434;
            proxy_set_header Host localhost;
            proxy_read_timeout 10s;
        }

        location / {
            return 403;
        }
    }
}
