# edge-relay: holds the published loopback port and forwards raw TCP to the UI proxy.
# It holds no credential and parses no HTTP; the Host allowlist, the role-path block and
# the operator credential all stay in the frontend container, which has no route to the
# host or the internet (internal networks only).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off; # Docker DNS; follows the frontend across restarts
    server {
        listen 8080;
        set $ui frontend:8080;
        proxy_pass $ui;
        proxy_connect_timeout 5s;
    }
}
