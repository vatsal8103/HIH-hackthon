[project]
name = "bayora-backend"
version = "0.1.0"
description = "Bayora secure AI red-teaming lab: API, simulated pipeline and audit chain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27", # in-process isolation probes (also used by the test client)
    "cryptography>=44",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be argument defaults.
extend-immutable-calls = ["fastapi.Depends", "app.auth.require"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
