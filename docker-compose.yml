# Bayora with isolated roles. Every service gets its own minimal network path:
#
#   browser ──public──▶ edge-relay ──ui_net──▶ frontend ──edge──▶ backend ──data──▶ db
#                                                                  ├──red_net──────▶ red-agent
#                                                                  ├──blue_net─────▶ blue-agent
#                                                                  ├──target_net───▶ target
#                                                                  └──witness_net──▶ witness
#
# All networks except `public` are internal (no egress). Only edge-relay, which holds no
# credential, sits on `public`; the frontend that injects the operator credential has no
# route to the host or the internet. Agents reach only the backend, never each other, the
# database or the witness. This is container isolation on one shared kernel (the Docker
# Desktop VM), not a kernel-level sandbox.
#
# Credentials (all from .env; `cd backend && uv run python -m app.keys ../.env` creates
# any that are missing without touching existing values):
#   backend    operator token hash only, its own grant-signing key, Red/Blue public keys,
#              witness token, runtime DB role bayora_app (no owner password)
#   red/blue   their own signing key + the control plane's public key
#   target     the control plane's public key only
#   migrate    the DB owner password; runs once, then exits
#   frontend   the plaintext operator token (to inject it); edge-relay holds nothing
#
# Live AI (optional): `docker compose --profile live up -d` with BAYORA_TARGET_PROVIDER=ollama
# in .env adds ollama-proxy, the target's only path to Ollama on the host:
#
#   target ──ollama_net (internal, target only)──▶ ollama-proxy ──ollama_egress──▶ host.docker.internal:11434
#
# The proxy holds no credential and forwards only POST /api/chat and GET /api/tags. Red, Blue
# and the backend are not on ollama_net. Without the profile nothing about the stack changes
# except that the target joins the (otherwise empty) internal ollama_net.
#
# Live AI via Groq (optional): `docker compose --profile groq up -d` with BAYORA_TARGET_PROVIDER=groq
# and GROQ_API_KEY in .env adds groq-proxy:
#
#   target (no key) ──groq_net (internal, target only)──▶ groq-proxy (holds the key) ──groq_egress──▶ api.groq.com:443
#
# groq-proxy adds the key, forwards only POST /openai/v1/chat/completions and GET /openai/v1/models,
# verifies Groq's certificate and connects only to api.groq.com. The target never holds the key.
name: bayora

x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp:size=16m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.5
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bayora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bayora
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    read_only: true
    tmpfs: ["/tmp:size=16m", "/var/run/postgresql:size=4m"]
    cap_drop: [ALL]
    # The entrypoint fixes data-directory ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bayora"]
      interval: 2s
      retries: 20

  # One-shot: schema, the bayora_app role with exact grants, and the append-only audit
  # trigger (app/migrate.py). The only container that ever holds the owner password.
  migrate:
    <<: *hardened
    build: { context: ./backend, target: api }
    command: [".venv/bin/python", "-m", "app.migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://bayora:${POSTGRES_PASSWORD:?}@db:5432/bayora
      BAYORA_APP_DB_PASSWORD: ${BAYORA_APP_DB_PASSWORD:?run app.keys to create it}
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  backend:
    <<: *hardened
    build: { context: ./backend, target: api }
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://bayora_app:${BAYORA_APP_DB_PASSWORD:?}@db:5432/bayora
      BAYORA_RUN_MIGRATIONS: "0" # the runtime role cannot create tables; migrate did
      BAYORA_REQUIRE_TOKENS: "1"
      BAYORA_OPERATOR_TOKEN_SHA256: ${BAYORA_OPERATOR_TOKEN_SHA256:?run app.keys to create it}
      BAYORA_CP_SIGNING_KEY: ${BAYORA_CP_SIGNING_KEY:?run app.keys to create it}
      BAYORA_CP_PUBLIC_KEYS: ${BAYORA_CP_PUBLIC_KEYS:?}
      BAYORA_RED_PUBLIC_KEYS: ${BAYORA_RED_PUBLIC_KEYS:?}
      BAYORA_BLUE_PUBLIC_KEYS: ${BAYORA_BLUE_PUBLIC_KEYS:?}
      BAYORA_RED_AGENT_URL: http://red-agent:8000
      BAYORA_BLUE_AGENT_URL: http://blue-agent:8000
      BAYORA_TARGET_AGENT_URL: http://target:8000
      BAYORA_TARGET_TIMEOUT: ${BAYORA_TARGET_TIMEOUT:-20} # live model: above BAYORA_OLLAMA_TIMEOUT, e.g. 330
      BAYORA_WITNESS_URL: http://witness:8000
      BAYORA_WITNESS_TOKEN: ${BAYORA_WITNESS_TOKEN:?set in .env}
    networks: [edge, data, red_net, blue_net, target_net, witness_net]
    depends_on:
      migrate: { condition: service_completed_successfully }
      witness: { condition: service_started }
      red-agent: { condition: service_started }
      blue-agent: { condition: service_started }
      target: { condition: service_started }

  red-agent:
    <<: *hardened
    build: { context: ./backend, target: agent }
    command: [".venv/bin/uvicorn", "agents.red_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BAYORA_API_URL: http://backend:8000
      BAYORA_RED_SIGNING_KEY: ${BAYORA_RED_SIGNING_KEY:?}
      BAYORA_CP_PUBLIC_KEYS: ${BAYORA_CP_PUBLIC_KEYS:?}
    networks: [red_net]

  blue-agent:
    <<: *hardened
    build: { context: ./backend, target: agent }
    command: [".venv/bin/uvicorn", "agents.blue_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BAYORA_API_URL: http://backend:8000
      BAYORA_BLUE_SIGNING_KEY: ${BAYORA_BLUE_SIGNING_KEY:?}
      BAYORA_CP_PUBLIC_KEYS: ${BAYORA_CP_PUBLIC_KEYS:?}
    networks: [blue_net]

  target:
    <<: *hardened
    build: { context: ./backend, target: agent }
    command: [".venv/bin/uvicorn", "agents.target_agent:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BAYORA_TARGET_PROVIDER: ${BAYORA_TARGET_PROVIDER:-simulator} # "ollama" needs the live profile
      BAYORA_OLLAMA_URL: http://ollama-proxy:11434
      BAYORA_OLLAMA_MODEL: ${BAYORA_OLLAMA_MODEL:-qwen3:4b}
      BAYORA_OLLAMA_TIMEOUT: ${BAYORA_OLLAMA_TIMEOUT:-300}
      BAYORA_GROQ_URL: http://groq-proxy:8080
      BAYORA_GROQ_AUTH: proxy # the key stays in groq-proxy; never passed to this container
      BAYORA_GROQ_MODEL: ${BAYORA_GROQ_MODEL:-qwen/qwen3.8-27b}
      BAYORA_GROQ_TIMEOUT: ${BAYORA_GROQ_TIMEOUT:-60}
      BAYORA_CP_PUBLIC_KEYS: ${BAYORA_CP_PUBLIC_KEYS:?} # verifies grants; holds no API credential
    networks: [target_net, ollama_net, groq_net]

  witness:
    <<: *hardened
    build: { context: ./backend, target: witness }
    environment:
      BAYORA_WITNESS_DATA: /data
      BAYORA_WITNESS_TOKEN: ${BAYORA_WITNESS_TOKEN:?}
    volumes:
      - witness-data:/data # mounted by the witness only
    networks: [witness_net]

  frontend:
    <<: *hardened
    build: { context: ./frontend, target: app }
    tmpfs: ["/tmp:size=16m", "/etc/nginx/conf.d:size=1m,uid=101,gid=101"]
    environment:
      BAYORA_TOKEN_OPERATOR: ${BAYORA_TOKEN_OPERATOR:?} # injected by nginx; never in the bundle
      NGINX_ENVSUBST_FILTER: "^BAYORA_"
    networks: [ui_net, edge] # internal only: no egress, no route to the host
    depends_on: [backend]

  ollama-proxy:
    <<: *hardened
    profiles: [live]
    build: { context: ./frontend, target: ollama-proxy }
    entrypoint: ["nginx", "-g", "daemon off;"] # skip the image's config-rewriting entrypoint scripts
    networks: [ollama_net, ollama_egress]

  groq-proxy:
    <<: *hardened
    profiles: [groq]
    build: { context: ./frontend, target: groq-proxy }
    tmpfs: ["/tmp:size=16m", "/etc/nginx/conf.d:size=1m,uid=101,gid=101"] # rendered config with the key
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-} # held here only; the proxy refuses to start without it
      NGINX_ENVSUBST_FILTER: "^GROQ_API_KEY$"
    networks: [groq_net, groq_egress]

  edge-relay:
    <<: *hardened
    build: { context: ./frontend, target: relay }
    entrypoint: ["nginx", "-g", "daemon off;"] # skip the image's config-rewriting entrypoint scripts
    ports:
      - "127.0.0.1:${BAYORA_UI_PORT:-8080}:8080" # loopback only
    networks: [public, ui_net]
    depends_on: [frontend]

networks:
  public: {} # the only network with outside connectivity; carries the published UI port
  ui_net: { internal: true }
  edge: { internal: true }
  data: { internal: true }
  red_net: { internal: true }
  blue_net: { internal: true }
  target_net: { internal: true }
  witness_net: { internal: true }
  ollama_net: { internal: true } # target ↔ ollama-proxy only
  ollama_egress: {} # ollama-proxy only: its route to host.docker.internal
  groq_net: { internal: true } # target ↔ groq-proxy only
  groq_egress: {} # groq-proxy only: its route to api.groq.com

volumes:
  pgdata:
  witness-data:
